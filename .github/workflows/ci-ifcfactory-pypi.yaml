# Publishes ifcfactory to PyPI when a GitHub Release is published
# Repository: https://github.com/LGV-BIM-Leitstelle/ifcfactory
name: Publish ifcfactory to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install dependencies and package
        run: |
          python -m pip install pytest
          python -m pip install .

      - name: Run tests
        run: |
          pytest

      - name: Build package
        run: |
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    
    permissions:
      # Required for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/ifcfactory/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

